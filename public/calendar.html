<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskify — Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topnav">
    <a href="index.html" class="nav-brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      Taskify
    </a>
    <div class="nav-links">
      <a href="tasks.html">My Tasks</a>
      <a href="calendar.html" class="active">Calendar</a>
      <a href="profile.html">Profile</a>
    </div>
    <div class="nav-user">
      <span class="nav-ava" data-user-initial>U</span>
      <span class="uname" data-user-first>You</span>
      <button class="logout-btn" data-logout>Log out</button>
    </div>
  </nav>

  <div class="wrap wide">
    <div class="cal-layout">
      <section class="cal-panel">
        <div class="cal-head">
          <div class="cal-title" id="cal-title">Month YYYY</div>
          <div class="cal-nav">
            <button class="arrow" id="cal-prev"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <button class="today-btn" id="cal-today">Today</button>
            <button class="arrow" id="cal-next"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </section>

      <section class="cal-panel">
        <div class="day-head">
          <span class="day-flower">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 5c0 4 1 7 5 8 4-1 5-4 5-8-1.3 1.8-2.7 1.8-3.5.2-.8 1.6-2.2 1.6-3 0-.8 1.6-2.2 1.6-3-.2C9.7 6.8 8.3 6.8 7 5Z" fill="#e8749e"/>
              <rect x="11.4" y="12" width="1.2" height="9" rx="0.6" fill="#6a9a3f"/>
              <path d="M12 17c-2.5-.6-4.6 1-5.6 3 2.3.2 4.4-.8 5.6-3z" fill="#6a9a3f"/>
            </svg>
          </span>
          <div class="day-title" id="day-title">Today's tasks</div>
        </div>

        <form class="add-bar" id="day-form">
          <span class="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
          <input type="text" id="day-input" placeholder="Add a task for this day…" autocomplete="off" maxlength="200" required>
          <button type="submit">Add</button>
        </form>

        <p class="status" id="status"></p>
        <ul class="day-list" id="day-list"></ul>
        <div class="empty" id="day-empty">
          <div class="ee"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
          <h3>Nothing here</h3>
          <p>No tasks were added on this day.</p>
        </div>
      </section>
    </div>
  </div>

  <script src="guard.js"></script>
  <script src="calendar.js"></script>
</body>
</html>

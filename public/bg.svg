<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5e4bf"/>
      <stop offset="1" stop-color="#c3d8a6"/>
    </linearGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd6a0"/>
      <stop offset="1" stop-color="#aecb8f"/>
    </linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6c47f"/>
      <stop offset="1" stop-color="#95b96e"/>
    </linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb466"/>
      <stop offset="1" stop-color="#7ea855"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdf3d6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fdf3d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="700" fill="url(#sky)"/>

  <!-- soft sun glow -->
  <circle cx="1180" cy="150" r="200" fill="url(#sun)"/>
  <circle cx="1180" cy="150" r="60" fill="#fbeec4" opacity="0.9"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="300" cy="130" rx="70" ry="26"/>
    <ellipse cx="360" cy="120" rx="55" ry="30"/>
    <ellipse cx="250" cy="140" rx="45" ry="22"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="920" cy="90" rx="60" ry="22"/>
    <ellipse cx="970" cy="82" rx="45" ry="26"/>
  </g>

  <!-- far hills -->
  <path d="M0 470 Q 240 380 480 460 T 960 450 T 1440 440 L1440 700 L0 700 Z" fill="url(#h1)"/>
  <!-- mid hills -->
  <path d="M0 540 Q 300 450 620 530 T 1140 520 Q 1300 500 1440 540 L1440 700 L0 700 Z" fill="url(#h2)"/>
  <!-- near hill -->
  <path d="M0 620 Q 360 560 760 610 T 1440 600 L1440 700 L0 700 Z" fill="url(#h3)"/>

  <!-- little trees -->
  <g fill="#6f9a4a">
    <circle cx="540" cy="560" r="16"/><rect x="536" y="568" width="8" height="16" fill="#7a5a3a"/>
    <circle cx="900" cy="576" r="13"/><rect x="897" y="582" width="6" height="13" fill="#7a5a3a"/>
    <circle cx="220" cy="600" r="18"/><rect x="215" y="608" width="9" height="18" fill="#7a5a3a"/>
    <circle cx="1180" cy="590" r="14"/><rect x="1177" y="597" width="7" height="14" fill="#7a5a3a"/>
  </g>
</svg>
